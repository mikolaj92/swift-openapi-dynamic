name: Daily Test

permissions:
  contents: read

on:
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_dispatch:  # Allow manual triggering

jobs:
  tests:
    name: Test (SwiftPM)
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@main
    with:
      linux_swift_versions: '[]'
      windows_swift_versions: '[]'
      enable_macos_checks: true
      macos_xcode_versions: '["latest"]'
      macos_versions: '["latest"]'
      ios_xcode_build_enabled: true
      watchos_xcode_build_enabled: true
      tvos_xcode_build_enabled: true
      visionos_xcode_build_enabled: true
      enable_wasm_sdk_build: false
      enable_android_sdk_build: false

  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@main
    with:
      license_header_check_project_name: "OpenAPIDynamic"
      license_header_check_enabled: false
      docs_check_enabled: false
      format_check_enabled: false
      unacceptable_language_check_enabled: false
      api_breakage_check_enabled: false